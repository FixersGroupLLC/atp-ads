<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ATP</title>
<style>
  html, body { margin:0; background:#0d0d0d; }
  main { display:flex; flex-direction:column; align-items:center; gap:56px; padding:40px 16px 64px; }
  video { height:min(82vh, 860px); max-width:100%; aspect-ratio:9/16; background:#000; border-radius:10px; display:block; }
  .car { width:min(100%, 560px); }
  .strip { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:10px; }
  .strip img { width:100%; flex:none; scroll-snap-align:center; border-radius:10px; display:block; }
  audio { width:100%; margin-top:12px; display:block; }
</style>
</head>
<body>
<main>
  <video controls playsinline preload="metadata" src="atp-mud-range.mp4"></video>
  <video controls playsinline preload="metadata" src="atp-new-designs.mp4"></video>
  <div class="car">
    <div class="strip">
      <img src="card-1.jpg" alt=""><img src="card-2.jpg" alt=""><img src="card-3.jpg" alt=""><img src="card-4.jpg" alt="">
      <img src="card-5.jpg" alt=""><img src="card-6.jpg" alt=""><img src="card-7.jpg" alt=""><img src="card-8.jpg" alt="">
    </div>
    <audio controls preload="metadata" src="atp-carousel.mp3"></audio>
  </div>
</main>
</body>
</html>
